[project]
name = "kb_curator"
version = "0.2.0"
description = "Curate Markdown knowledge vaults — catalogue, classify, audit, repair, link-check, rename, enrich."
requires-python = ">=3.10"
# Runtime: stdlib only. PyYAML is auto-detected and used when available;
# the scoped fallback parser in kb_curator.yaml_io handles config + frontmatter.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
    "pytest>=7.0",
    "PyYAML>=6.0",
]

[project.scripts]
kb-curator = "kb_curator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
