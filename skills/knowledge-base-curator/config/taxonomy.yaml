# ---------------------------------------------------------------------------
# Naming conventions for note filenames. Drives `naming check` and `rename`.
# Filenames are derived from the frontmatter `title` field after normalisation.
# ---------------------------------------------------------------------------
naming:
  replace_underscores: true   # foo_bar -> foo bar
  strip_emoji_prefix: true    # remove leading 🚀/🌐/etc. (re-added by `emojis apply`)
  max_length: 120
  # Reserved characters get replaced with '-' regardless of this list.

# ---------------------------------------------------------------------------
# Emoji sigils per category. `emojis apply` injects these as a prefix on the
# H1 of every note in that category. Idempotent: re-runs do not double-prefix.
# Leave any category unset to skip emoji prefixing for it.
# ---------------------------------------------------------------------------
