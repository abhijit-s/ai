# Canonical taxonomy for the KnowledgeBase vault.
#
# Edit this file when you evolve the taxonomy. The CLI in scripts/kb_curator.py
# reads it for every audit/classify/apply operation.
#
# Slugs are kebab-case, lowercase, ASCII. Paths are relative to vault.root and
# preserve the human-readable directory names (with spaces and "&").

vault:
  root: "/Users/a.salvi/Data/Obsidian/Vault/obsidian-vault-abhi.io/KnowledgeBase"
  exclude_dirs:
    - zAttachments
    - .obsidian
    - .trash
    - .git

# ---------------------------------------------------------------------------
# Path conventions — how the skill maps directory layout to the
# Pillar/Area/Sub-area/Topic hierarchy.
#
# `pillar_pattern` is a regex applied to top-level directory names. If it
# matches, capture group 1 is treated as the human-readable pillar name; the
# slug comes from `taxonomy.yaml > pillars`. If you don't number your pillars,
# set this to `^(.+)$` to accept any top-level directory.
#
# `sub_area_pattern` applies the same logic to the directory level below an
# area. Leave it at the default to keep numbered sub-areas; set to null to
# treat every intermediate directory as a `topic` instead of a `sub_area`.
# ---------------------------------------------------------------------------
path_conventions:
  pillar_pattern: '^\d{2}-(.+)$'
  sub_area_pattern: '^\d{2}-(.+)$'
  readme_filename: README.md

# ---------------------------------------------------------------------------
# Link syntax — which form of cross-note links the vault uses.
#   obsidian  → [[Note Stem]] and [[Note Stem|display]]
#   markdown  → [display](Note%20Stem.md)   (relative-path Markdown links)
#   none      → disable link checking / repair entirely
# ---------------------------------------------------------------------------
link_syntax:
  type: obsidian

# ---------------------------------------------------------------------------
# Slug casing — applied to category / pillar / sub_area / topic / tag values.
#   kebab → like-this
#   snake → like_this
#   camel → likeThis
# ---------------------------------------------------------------------------
slug_case: kebab

# ---------------------------------------------------------------------------
# Where `created` / `updated` come from in `enrich`.
#   git    → git log --follow (recommended when the vault is in git)
#   mtime  → filesystem mtime / first observed (fallback when no git)
#   none   → skip date derivation entirely
# ---------------------------------------------------------------------------
dates:
  source: git

frontmatter:
  # Required on every note.
  required: [title, category, tags]
  # Optional but auto-derived by `enrich` (path / git / tags).
  derived: [pillar, sub_area, topic, kind, created, updated]
  optional: [aliases, spec, metadata]
  casing:
    category: kebab-case
    pillar: kebab-case
    sub_area: kebab-case
    topic: kebab-case
    kind: kebab-case
    tags: kebab-case
  rules:
    # First tag should mirror the category for grep-ability.
    first_tag_mirrors_category: true
    # READMEs additionally carry this tag.
    readme_extra_tag: index
  # Derivation policy — `enrich` reads these and applies the rules.
  # `pillar`   ← from path level 1 (the NN-Pillar directory)
  # `sub_area` ← from path level 3 if its name matches /^\d{2}-(.+)/
  # `topic`    ← from path level 3 or 4 if not a numbered sub-area
  # `kind`     ← one of: index | crash-course | deep-dive | reference | note
  # `created`  ← `git log --diff-filter=A --format=%aI <file>` (oldest)
  # `updated`  ← `git log -1 --format=%aI <file>`
  kind_from_tag:
    - index
    - crash-course
    - deep-dive
    - reference

