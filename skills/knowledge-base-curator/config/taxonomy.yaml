# ---------------------------------------------------------------------------
# Content-based tag inference rules. `tags suggest <path>` matches each rule's
# keywords against the file's title+body (case-insensitive substring); if any
# keyword hits, the rule's tag is proposed.
#
# Keep rules narrow — broad keywords (e.g., "the") flood every note. Each rule
# must justify itself: would a human searching by this tag expect this file?
# ---------------------------------------------------------------------------
inference_rules:
  - tag: performance
    keywords: [latency, throughput, p99, p95, benchmark, performance bottleneck, ops/sec]
  - tag: security
    keywords: [oauth, jwt, mtls, csrf, xss, authentication, authorization, attack surface]
  - tag: deep-dive
    keywords: ["deep dive", "deep-dive"]
  - tag: crash-course
    keywords: ["crash course", "crash-course"]
  - tag: observability
    keywords: [prometheus, grafana, opentelemetry, tracing, span, metrics, slog, datadog]
  - tag: reliability
    keywords: [circuit breaker, retry, backoff, idempotenc, slo, error budget]
  - tag: concurrency
    keywords: [goroutine, mutex, atomic, race condition, deadlock, channel]
  - tag: memory
    keywords: [heap, stack, allocator, garbage collect, mmap, escape analys]
  - tag: networking
    keywords: [tcp, udp, dns lookup, packet, mtu, congestion]
  - tag: scalability
    keywords: [horizontally scale, sharding, partition, autoscal, capacity planning]

# Controlled tag vocabulary. Open tags are allowed in addition to these, but
# the audit command warns when a tag appears only once across the vault.
tags:
  # Note kind / shape
  - index
  - crash-course
  - deep-dive
  - quick-blogs
  - reference
  - cheatsheet
  - excalidraw
  # Cross-cutting concerns
  - performance
  - security
  - memory
  - concurrency
  - observability
  - reliability
  - scalability
  # Topical (commonly co-occurring with categories above)
  - golang
